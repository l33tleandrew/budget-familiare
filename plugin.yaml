name: budget-familiare
version: 1.0.0
manifest_version: 2
api_version: "1.0"
description: Registra spese ed entrate della famiglia sul foglio Budget di Google Sheets
author: Andrea Loprieno
license: MIT
homepage: https://github.com/l33tleandrew/budget-familiare
tags: [budget, google-sheets, finanza]

provides_tools:
  - registra_transazione

provides_hooks:
  - pre_llm_call
  - pre_tool_call
  - transform_llm_output
  - on_session_end

# Quello che cambia da un'istanza all'altra. `hermes plugins install` lo chiede
# e lo salva nel .env del profilo; budget_sheets.py lo legge con lo stesso nome
# (CONFIGURAZIONE), e un test verifica che le due liste coincidano. Se manca,
# il turno finisce in `errore_configurazione` invece di scrivere.
requires_env:
  - name: GOOGLE_SPREADSHEET_ID
    description: "ID del foglio Google: la parte dell'URL fra /d/ e /edit"
  - name: ANNO_BUDGET
    description: "Anno del budget, es. 2026: la scheda «Transazioni <anno>» deve esistere"

# Per default la scheda si chiama «Transazioni <ANNO_BUDGET>».
optional_env:
  - GOOGLE_SHEET_NAME

# Niente `capabilities`: non si fa override di tool ne' del modello, quindi
# all'installazione non c'e' nessun consenso da chiedere.
#
# Le credenziali Google non stanno qui: sono file nel profilo (HERMES_HOME),
# creati da setup_google.py.
